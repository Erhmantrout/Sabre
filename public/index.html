<script>
/* Saves to the Sabre Worker (/api/<room>/...) instead of the Claude artifact runtime. */
(function(){
  var seg=((location.pathname.split('/')[1]||'hub').toLowerCase().replace(/[^a-z0-9-]/g,''))||'hub';
  window.ROOM={brand:seg,api:'/api/'+seg+'/',tags:['Ade','Hayley','Stasa']};
  try{if(/[?&]client\b/.test(location.search))localStorage.setItem('apm-room-mode','client')}catch(e){}
  async function api(path,opts){
    const url=path==='assets'?'/api/assets':window.ROOM.api+path;
    const r=await fetch(url,Object.assign({headers:{'content-type':'application/json'}},opts||{}));
    if(!r.ok)throw new Error('Save failed ('+r.status+')');
    return r.json();
  }
  function coll(name,order,lim){
    return {
      orderBy(){return coll(name,true,lim)},
      limit(n){return coll(name,order,n)},
      doc(id){return{
        set(data){return api(name+'/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(data)})},
        delete(){return api(name+'/'+encodeURIComponent(id),{method:'DELETE'})}
      }},
      onSnapshot(ok,bad){
        let last='',stop=false;
        async function tick(){
          if(stop)return;
          try{
            const rows=await api(name+(lim?'?limit='+lim:''));
            const s=JSON.stringify(rows);
            if(s!==last){last=s;ok({docs:rows.map(r=>({id:r.id,data:()=>r.data}))})}
          }catch(e){if(!last&&bad){bad(e)}}
          setTimeout(tick,5000);
        }
        tick();return function(){stop=true};
      }
    };
  }
  const db={collection:function(n){return coll(n)}};
  const user={me:async()=>({id:'browser'}),canEdit:()=>true,can:()=>true,profiles:async()=>({})};
  async function shrink(file){
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const sc=Math.min(1,1350/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    let q=0.85,d=c.toDataURL('image/jpeg',q);
    while(d.length>1100000&&q>0.4){q-=0.1;d=c.toDataURL('image/jpeg',q)}
    return d.split(',')[1];
  }
  const assets={upload:async function(file){
    const data=await shrink(file);
    const r=await api('assets',{method:'POST',body:JSON.stringify({data,type:'image/jpeg'})});
    return {id:r.id};
  }};
  const dl={save:async function(o){
    const b=new Blob([o.data],{type:'text/csv'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
  }};
  window.claude={use:async function(k){
    if(k==='db')return db;if(k==='user')return user;if(k==='downloads')return dl;if(k==='assets')return assets;
    throw new Error('not available');
  }};
})();
</script>

<script>
(function(){
const SEED=/*SEED*/{links:[],tasks:[],people:[]};
const TS=[['awaiting','Awaiting approval'],['decision','Decision needed'],['waiting','Waiting on info'],['todo','To do'],['progress','In progress'],['live','Live'],['done','Done']];
const TL=Object.fromEntries(TS);
const CATS=['Social & content','Brand & design','Campaigns & launches','Reporting'];
const LCATS=['Brand & guidelines','Content & calendars','Canva','Platforms','Reports','Master logins'];
const ROLES=['Viewer','Editor','Approver'];
const APS=[['pending','Pending approval'],['approved','Approved'],['changes','Changes requested'],['declined','Declined']];
const SC={awaiting:'--s-review',decision:'--s-review',waiting:'--s-changes',todo:'--s-draft',progress:'--s-scheduled',live:'--s-approved',done:'--s-published',pending:'--s-review',approved:'--s-approved',changes:'--s-changes',declined:'--s-published'};
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TODAY=(d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'))(new Date());
const fd=d=>d?new Date(d+'T12:00:00').toLocaleDateString('en-AU',{day:'numeric',month:'short',year:'numeric'}):'';
const S={tab:'overview',mode:'team',ed:true,live:false,db:null,user:null,me:null,names:{},data:{tasks:{},links:{},people:{},approvals:{},brand:{}},audit:[],modal:null,assets:null,tf:'all',q:'',chip:'all',toast:''};
try{const m=localStorage.getItem('sabre-hub-mode');if(m)S.mode=m}catch(e){}
const isTeam=()=>S.mode==='team';
const list=c=>Object.values(S.data[c]||{});
function toast(t){S.toast=t;render();clearTimeout(toast.t);toast.t=setTimeout(()=>{S.toast='';render()},3000)}
const badge=(k,l)=>'<span class="badge" style="--sc:var('+(SC[k]||'--s-draft')+')">'+esc(l)+'</span>';
function nameOf(id){if(id==='client')return 'Client';if(!id||id==='demo'||id==='team')return 'Six Underground';if(S.me&&id===S.me.id)return 'You';return S.names[id]||'Someone'}

/* data */
async function put(c,id,obj,note){
  S.data[c]=Object.assign({},S.data[c],{[id]:obj});
  if(S.live){try{await S.db.collection(c).doc(id).set(obj)}catch(e){toast('Could not save: '+(e&&e.message||'refused'));return false}}
  if(note)await log(note);render();return true}
async function del(c,id,note){
  const o=Object.assign({},S.data[c]);delete o[id];S.data[c]=o;
  if(S.live){try{await S.db.collection(c).doc(id).delete()}catch(e){toast('Could not delete: '+(e&&e.message||'refused'));return}}
  if(note)await log(note);render()}
async function log(text){
  const a={at:Date.now(),by:S.mode,text};const id='a'+a.at+Math.random().toString(36).slice(2,5);
  if(S.live){try{await S.db.collection('audit').doc(id).set(a)}catch(e){}}else{S.audit.unshift(Object.assign({id},a))}}
async function resolveNames(){
  if(!S.user||!S.live)return;const ids=[...new Set(S.audit.map(e=>e.by).filter(Boolean))].filter(i=>!(i in S.names));if(!ids.length)return;
  try{const ps=await S.user.profiles(ids.slice(0,64));ids.forEach(i=>{S.names[i]=(ps[i]&&ps[i].name)||''});render()}catch(e){}}
function demo(){['links','tasks','people'].forEach(c=>{const o={};SEED[c].forEach(x=>o[x.id]=x);S.data[c]=o})}
demo();
async function boot(){
  render();
  try{
    const cl=window.claude;if(!cl||!cl.use)throw 0;
    const [db,user,assets]=await Promise.all([cl.use('db').catch(()=>null),cl.use('user').catch(()=>null),cl.use('assets').catch(()=>null)]);S.assets=assets;
    S.user=user;
    if(user){try{S.me=await user.me()}catch(e){}let ed=false;try{ed=user.canEdit()}catch(e){}S.ed=ed;if(!ed)S.mode='client';else if(!localStorage.getItem('sabre-hub-mode'))S.mode='team'}
    if(db){S.db=db;S.live=true;
      ['tasks','links','people','approvals','brand'].forEach(c=>db.collection(c).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>o[d.id]=d.data());S.data[c]=o;render()},()=>{}));
      db.collection('audit').orderBy('at','desc').limit(100).onSnapshot(sn=>{S.audit=sn.docs.map(d=>Object.assign({id:d.id},d.data()));resolveNames();render()},()=>{});
    }
  }catch(e){}
  render();
}

/* views */
function header(){
  const seg=S.ed?'<div class="seg"><button data-act="mode" data-v="team" aria-pressed="'+isTeam()+'">Team</button><button data-act="mode" data-v="client" aria-pressed="'+!isTeam()+'">Client</button></div>':'';
  const tabs=[['overview','Overview'],['progress','Progress'],['approvals','Approvals'],['directory','Directory'],['brand','Brand book'],['access','People & access']];
  const pend=list('approvals').filter(a=>a.status==='pending').length;
  return '<header class="top"><div class="brand"><div class="eyebrow">Six Underground × Sabre</div><h1>Sabre <span>Client Hub</span></h1></div><div class="who"><span class="chip '+(S.live?'live':'')+'">'+(S.live?'Live · shared':'Preview · changes stay on this screen')+'</span>'+seg+'</div></header>'+
  '<nav class="tabs">'+tabs.map(t=>'<button data-act="tab" data-v="'+t[0]+'" aria-selected="'+(S.tab===t[0])+'">'+t[1]+(t[0]==='approvals'&&pend?'<span class="n">'+pend+'</span>':'')+'</button>').join('')+'</nav>';
}
const BRANDS=[
  {slug:'actyva',name:'Actyva',c:'#4a5d23',d:'Brand Room · calendar, approvals, Metricool export'},
  {slug:'kemon',name:'Kemon',c:'#0b6b4f',d:'Brand Room · calendar, approvals, Metricool export'},
  {slug:'solfine',name:'Solfine',c:'#636750',d:'Brand Room · calendar, approvals, Metricool export'},
  {slug:'hanz-de-fuko',name:'Hanz de Fuko',c:'#1a1a1a',d:'Brand Room · calendar, approvals, Metricool export'},
  {slug:'joico',name:'Joico',c:'#d83789',d:'Brand page · no scheduling'}
];
function brandCards(){return '<div class="bcards">'+BRANDS.map(b=>'<a class="bcard" style="--bc:'+b.c+'" href="/'+b.slug+'/"><i>'+(b.slug==='joico'?'Brand':'Brand Room')+'</i><b>'+esc(b.name)+'</b><span>'+esc(b.d)+'</span></a>').join('')+'</div>'}
function overview(){
  const t=list('tasks');const c=k=>t.filter(x=>x.status===k).length;
  const next=t.filter(x=>x.due&&x.due>=TODAY&&!['done','live'].includes(x.status)).sort((a,b)=>a.due.localeCompare(b.due)).slice(0,6);
  const pend=list('approvals').filter(a=>a.status==='pending').length;
  return '<div class="bar"><div><h2>Where Sabre stands</h2><p class="muted" style="margin:4px 0 0">One place for everything. Open a brand to see its content calendar, approvals and comments.</p></div></div>'+brandCards()+
  '<div class="cols" style="margin-bottom:20px">'+[['Open tasks',t.filter(x=>!['done','live'].includes(x.status)).length],['In progress',c('progress')],['Waiting on info',c('waiting')],['Awaiting your approval',pend]].map(x=>'<div class="card stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')+'</div>'+
  '<div class="two"><div class="card"><h3>Coming up</h3>'+(next.length?next.map(x=>'<div class="rowl"><b>'+fd(x.due)+'</b><span>'+esc(x.title)+'</span>'+badge(x.status,TL[x.status])+'</div>').join(''):'<p class="muted">No dated tasks. Add a due date to a task to see it here.</p>')+'</div>'+
  '<div class="card"><h3>Where things are</h3><ul class="clean"><li><b>Tasks and progress</b>: Progress tab</li><li><b>Things needing a client decision</b>: Approvals tab</li><li><b>Folders, calendars, platforms</b>: Directory tab</li><li><b>Brand rules and colours</b>: Brand book tab</li><li><b>Who can see what</b>: People &amp; access tab</li></ul></div></div>';
}
function progress(){
  const t=list('tasks');
  let h='<div class="bar"><div class="grp"><h2>Progress</h2><span class="muted">'+t.length+' tasks</span></div>'+(isTeam()?'<button class="btn acc sm" data-act="new" data-v="tasks">+ Add task</button>':'')+'</div>'+

    h+='<div class="block"><h3>'+esc(cat)+'</h3><div class="tw"><table class="list"><thead><tr><th>Task</th><th>Status</th><th>Owner</th><th>Due</th></tr></thead><tbody>'+rows.map(x=>'<tr class="'+(isTeam()?'r':'')+'" '+(isTeam()?'data-act="edit" data-c="tasks" data-v="'+x.id+'"':'')+'><td><b>'+esc(x.title)+'</b><div class="muted">'+esc(x.detail)+'</div>'+att(x)+'</td><td>'+badge(x.status,TL[x.status])+'</td><td>'+esc(x.owner||'Unassigned')+'</td><td style="white-space:nowrap">'+fd(x.due)+'</td></tr>').join('')+'</tbody></table></div></div>'});

}
function directory(){

  const b=S.data.brand.main||{};const sw=b.swatches||[['Blush','#FFF3F5','Backgrounds'],['Orchid','#FFA6EB','Highlights'],['Rose','#F36AAF','Support colour'],['Hot pink','#F155A5','Accent'],['Deep pink','#D83789','Primary accent and buttons']];
  return '<div class="bar"><h2>Brand book</h2></div><div class="warn" style="margin-bottom:16px">Colours are sampled from the Sabre brand sheet. Check them against the master brand files.'+(isTeam()?' Edit the hex values below and click Save.':'')+'</div>'+
  '<div class="card" style="margin-bottom:16px"><h3>Palette</h3><div class="sw2">'+sw.map((s,i)=>'<div class="swc"><i style="background:'+esc(s[1])+'"></i><b>'+esc(s[0])+'</b>'+(isTeam()?'<input id="hx'+i+'" value="'+esc(s[1])+'" aria-label="Hex for '+esc(s[0])+'">':'<code>'+esc(s[1])+'</code>')+'<span class="muted">'+esc(s[2])+'</span></div>').join('')+'</div>'+(isTeam()?'<div class="row" style="margin-top:10px"><button class="btn sm pri" data-act="savesw">Save palette</button></div>':'')+'</div>'+
  '<div class="two"><div class="card"><h3>Typography</h3><ul class="clean"><li><b>Lora</b> for headings and display text.</li><li><b>ABeeZee</b> for captions, body copy and small text.</li></ul></div>'+
  '<div class="card"><h3>Voice</h3><ul class="clean"><li>Warm, empowering and educational. Never pushy or salesy.</li><li>Light emoji use.</li><li>Avoid: cheap, discount, deal, luxury, perfect, amazing, just.</li></ul><p class="muted">From the Sabre brand profile in Notion. Confirm before use.</p></div>'+
  '<div class="card"><h3>Hashtags</h3><p>#Sabre #CurlyHairSydney #NaturalHair #CurlyHairCare #SydneyHairdresser #TexturedHair #CurlyCommunity #HairTransformation</p></div></div>';
}
function access(){
  const p=list('people');
  let h='<div class="bar"><div><h2>People &amp; access</h2><p class="muted" style="margin:4px 0 0">Who works on the Sabre rooms. Roles here are a record only: anyone with the link can use the page.</p></div>'+(isTeam()?'<button class="btn acc sm" data-act="new" data-v="people">+ Add person</button>':'')+'</div>'+
  '<div class="tw"><table class="list"><thead><tr><th>Person</th><th>Role</th><th>Covers</th></tr></thead><tbody>'+p.map(x=>'<tr><td><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.title)+' · '+esc(x.org)+'</div></td><td>'+badge(x.role==='Approver'?'live':x.role==='Editor'?'progress':'todo',x.role)+'</td><td>'+esc(x.scope)+(isTeam()?' <button class="lnk" data-act="edit" data-c="people" data-v="'+x.id+'">Edit</button>':'')+'</td></tr>').join('')+'</tbody></table></div>'+
  '<div class="block" style="margin-top:24px"><h3>Roles</h3><ul class="clean"><li><b>Viewer</b>: can look, cannot change anything.</li><li><b>Editor</b>: can add and change tasks, links and posts.</li><li><b>Approver</b>: can also make the final call on approvals.</li></ul></div>'+
  '<div class="block" style="margin-top:24px"><h3>Recent changes</h3>'+(S.audit.length?'<ul class="aud">'+S.audit.slice(0,30).map(a=>'<li><time>'+new Date(a.at).toLocaleString('en-AU',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'})+'</time><span><b>'+esc(nameOf(a.by))+'</b> '+esc(a.text)+'</span></li>').join('')+'</ul>':'<p class="muted">No changes recorded yet.</p>')+'</div>';
  return h;
}
const FORMS={
 tasks:{label:'task',f:[['title','Task','text'],['detail','Details','area'],['cat','Category','sel',CATS],['status','Status','sel',TS],['owner','Owner','text'],['due','Due date','date'],['urls','Links (one per line: Canva, Drive, Docs…)','area'],['files','Files','files']]},
 links:{label:'link',f:[['title','Title','text'],['desc','What it is','text'],['cat','Section','sel',LCATS],['platform','Platform (Drive, Canva…)','text'],['url','URL (leave empty for a login reference)','text'],['vault','This is a login reference (no password here)','chk']]},
 people:{label:'person',f:[['name','Name','text'],['title','Company','text'],['org','Team or client','sel',['Team','Client']],['role','Role','sel',ROLES],['scope','Covers','text']]},
 approvals:{label:'approval request',f:[['title','What needs a decision','text'],['detail','Details','area'],['due','Needed by','date'],['status','Status','sel',APS]]}
};
function grab(){const m=S.modal;if(!m)return;m.vals=m.vals||{};FORMS[m.c].f.forEach(([k,,t])=>{if(t==='files')return;const el=document.getElementById('f_'+k);if(el)m.vals[k]=t==='chk'?el.checked:el.value})}
function att(x){const u=String(x.urls||'').split(/\s+/).filter(s=>/^https?:\/\//.test(s));const f=x.files||[];if(!u.length&&!f.length)return '';return '<div class="atts">'+u.map(s=>{let h=s;try{h=new URL(s).hostname.replace(/^www\./,'')}catch(e){}return '<a class="atc" href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(h)+' ↗</a>'}).join('')+f.map(y=>'<a class="atc" href="/_blob/'+esc(y.id)+'" target="_blank" rel="noopener">File: '+esc(y.name)+'</a>').join('')+'</div>'}
function modal(){
  const m=S.modal;if(!m)return '';const F=FORMS[m.c];const o=m.id?S.data[m.c][m.id]:(m.pre||{});
  const inp=([k,l,t,opts])=>{const v=(m.vals&&k in m.vals)?m.vals[k]:o[k]!=null?o[k]:(k==='status'?(m.c==='approvals'?'pending':'todo'):k==='cat'?(opts||[])[0]:k==='role'?'Viewer':k==='org'?'Client':'');
    if(t==='files'){const fl=m.files||[];return '<div class="field"><label>'+l+'</label>'+fl.map((f,i)=>'<div class="fchip"><a href="/_blob/'+esc(f.id)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a><button class="lnk" data-act="rmfile" data-v="'+i+'">Remove</button></div>').join('')+(S.assets?'<input type="file" id="f_upl" multiple data-act="upl">':'<p class="muted">File uploads need editor access.</p>')+(m.busy?'<p class="muted">Uploading…</p>':'')+'</div>'}
    if(t==='area')return '<div class="field"><label>'+l+'</label><textarea id="f_'+k+'" rows="3">'+esc(v)+'</textarea></div>';
    if(t==='date')return '<div class="field"><label>'+l+'</label><input type="date" id="f_'+k+'" value="'+esc(v)+'"></div>';
    if(t==='chk')return '<label class="row"><input type="checkbox" id="f_'+k+'"'+(v?' checked':'')+'> '+l+'</label>';
    if(t==='sel')return '<div class="field"><label>'+l+'</label><select id="f_'+k+'">'+opts.map(x=>{const val=Array.isArray(x)?x[0]:x,lab=Array.isArray(x)?x[1]:x;return '<option value="'+esc(val)+'"'+(v===val?' selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select></div>';
    return '<div class="field"><label>'+l+'</label><input id="f_'+k+'" value="'+esc(v)+'"></div>'};
  return '<div class="ov" data-act="bg"><div class="dlgwrap" style="max-width:520px"><button class="close" data-act="mclose" aria-label="Close">×</button><div class="dlg" style="grid-template-columns:1fr"><div class="side"><h2>'+(m.id?'Edit ':'Add ')+F.label+'</h2>'+F.f.map(inp).join('')+'<div class="row"><button class="btn acc" data-act="msave">Save</button>'+(m.id?'<button class="btn bad" data-act="mdel">Delete</button>':'')+'</div></div></div></div></div>';
}
function render(){
  const sy=window.scrollY;const a=document.activeElement;const keep=a&&a.id&&/^hx|^f_/.test(a.id)||(a&&a.dataset&&a.dataset.act==='q')?a:null;const kid=keep&&(keep.id||'q');const ks=keep&&keep.selectionStart;
  if(!isTeam()&&S.tab==='access'&&false)S.tab='overview';
  const v={overview,progress,approvals,directory,brand,access}[S.tab]();
  $('#app').innerHTML=header()+'<main>'+v+'</main>'+modal()+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
  window.scrollTo(0,sy);
  if(kid){const el=kid==='q'?document.querySelector('[data-act=q]'):document.getElementById(kid);if(el){el.focus();try{el.setSelectionRange(ks,ks)}catch(e){}}}
}
document.addEventListener('input',e=>{if(e.target.dataset&&e.target.dataset.act==='q'){S.q=e.target.value;render()}});
document.addEventListener('change',async e=>{const t=e.target;if(t.dataset&&t.dataset.act==='upl'&&S.assets&&S.modal){const m=S.modal,fs=[...t.files];grab();m.busy=true;render();for(const f of fs){try{const u=await S.assets.upload(f);m.files.push({id:u.id,name:f.name})}catch(x){toast('Could not upload '+f.name)}}m.busy=false;render();return}
  if(t.dataset&&t.dataset.act==='apst'){const x=S.data.approvals[t.dataset.v];if(x){await put('approvals',x.id,Object.assign({},x,{status:t.value}),'set "'+x.title+'" to '+t.value)}}});
document.addEventListener('click',async e=>{
  if(e.target.closest('a'))return;const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  if(a==='q'||a==='apst'||a==='upl')return;
  if(a==='bg'){if(e.target===el){S.modal=null;render()}return}
  if(a==='mode'){S.mode=v;try{localStorage.setItem('sabre-hub-mode',v)}catch(x){}return render()}
  if(a==='tab'){S.tab=v;return render()}
  if(a==='tf'){S.tf=v;return render()}
  if(a==='chip'){S.chip=v;return render()}
  if(a==='new'){S.modal={c:v,files:[],pre:el.dataset.pre?{cat:'Canva',platform:'Canva'}:null};return render()}
  if(a==='rmfile'){grab();S.modal.files.splice(+v,1);return render()}
  if(a==='edit'){S.modal={c:el.dataset.c,id:v,files:((S.data[el.dataset.c][v]||{}).files||[]).slice()};return render()}
  if(a==='mclose'){S.modal=null;return render()}
  if(a==='mdel'){const m=S.modal;const o=S.data[m.c][m.id];S.modal=null;return del(m.c,m.id,'removed '+FORMS[m.c].label+' "'+(o.title||o.name)+'"')}
  if(a==='msave'){const m=S.modal,F=FORMS[m.c];const o=Object.assign({},m.id?S.data[m.c][m.id]:{});
    F.f.forEach(([k,,t])=>{if(t==='files'){o.files=m.files||[];return}const el=document.getElementById('f_'+k);o[k]=t==='chk'?el.checked:el.value.trim()});
    if(!(o.title||o.name)){toast('Add a title first');return}
    o.id=m.id||m.c[0]+Date.now().toString(36);if(m.c==='tasks')o.updated=Date.now();if(m.c==='approvals'&&!o.created)o.created=Date.now();
    S.modal=null;await put(m.c,o.id,o,(m.id?'updated ':'added ')+F.label+' "'+(o.title||o.name)+'"');return}
  if(a==='savesw'){const sw=(S.data.brand.main&&S.data.brand.main.swatches)||[['Blush','#FFF3F5','Backgrounds'],['Orchid','#FFA6EB','Highlights'],['Rose','#F36AAF','Support colour'],['Hot pink','#F155A5','Accent'],['Deep pink','#D83789','Primary accent and buttons']];
    const n=sw.map((s,i)=>[s[0],(document.getElementById('hx'+i).value||s[1]).trim(),s[2]]);await put('brand','main',{id:'main',swatches:n},'updated the brand palette');toast('Palette saved');return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal){S.modal=null;render()}});
boot();
})();
</script>

</body></html>
