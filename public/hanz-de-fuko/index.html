<title>Hanz de Fuko Brand Room</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>




/* Hanz de Fuko tokens */
:root{
--purple-100:#ececec;--purple-300:#ffffff;--purple-600:#000000;--purple-700:#2a2a2a;--taupe-300:#c4c4c4;--blue-400:#8e8e8e;--mauve-300:#bdbdbd;--brown-700:#2a2a2a;--cream-100:#e8e8e8;--grey-900:#0a0a0a;--grey-600:#5c5c5c;--grey-100:#dcdcdc;
--font:"Archivo",-apple-system,BlinkMacSystemFont,sans-serif;
--r:2px;
--bg:var(--cream-100);--surface:#f6f6f6;--surface2:var(--grey-100);--ink:#000000;--ink2:var(--brown-700);--muted:var(--grey-600);--line:var(--taupe-300);
--accent:var(--purple-600);--accent-hover:var(--purple-700);--accent-text:var(--purple-700);--accent-soft:var(--purple-100);--accent-ink:#fff;
--s-draft:#6b6560;--s-review:#8a6a3d;--s-changes:#a4473d;--s-approved:#4d7a5c;--s-scheduled:#4f7396;--s-published:#604e3d;
--shadow:0 12px 32px -12px rgba(43,39,37,.18);--shadow-hover:0 16px 40px -14px rgba(43,39,37,.24);--shadow-dlg:0 24px 60px -18px rgba(43,39,37,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--ink:#ffffff;--ink2:#bdbdbd;--muted:#9a9a9a;--line:#333333;
--accent:var(--purple-300);--accent-hover:var(--purple-100);--accent-text:var(--purple-300);--accent-soft:#262626;--accent-ink:#000000;
--s-draft:#b0a8a2;--s-review:#d1aa72;--s-changes:#e08a7e;--s-approved:#8cc29c;--s-scheduled:#98b7d3;--s-published:#cebcc5;
--shadow:0 12px 32px -12px rgba(0,0,0,.6);--shadow-hover:0 16px 40px -14px rgba(0,0,0,.7);--shadow-dlg:0 24px 60px -18px rgba(0,0,0,.8)}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--ink:#ffffff;--ink2:#bdbdbd;--muted:#9a9a9a;--line:#333333;
--accent:var(--purple-300);--accent-hover:var(--purple-100);--accent-text:var(--purple-300);--accent-soft:#262626;--accent-ink:#000000;
--s-draft:#b0a8a2;--s-review:#d1aa72;--s-changes:#e08a7e;--s-approved:#8cc29c;--s-scheduled:#98b7d3;--s-published:#cebcc5;
--shadow:0 12px 32px -12px rgba(0,0,0,.6);--shadow-hover:0 16px 40px -14px rgba(0,0,0,.7);--shadow-dlg:0 24px 60px -18px rgba(0,0,0,.8)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 15px/1.4 var(--font);letter-spacing:0;padding-block:0 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;transition:background-color .18s ease-out,border-color .18s ease-out,color .18s ease-out,transform .15s ease-out}
button:active:not([disabled]){transform:scale(.98)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;gap:24px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding:40px 0 24px;border-bottom:1px solid var(--line)}
.brand{min-width:0;display:grid;gap:12px}
.logo{display:block;width:150px;height:auto;color:var(--ink)}
.wm{font:800 28px/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--ink);overflow-wrap:anywhere}
.eyebrow{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{margin:0;font:700 clamp(32px,5.5vw,44px)/1.1 var(--font);letter-spacing:0;text-wrap:balance}
h1 span{color:var(--accent)}
.who{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 16px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.chip{font-size:12px;padding:5px 10px;border-radius:var(--r);border:1px solid var(--line);color:var(--muted);background:var(--surface);font-weight:500}
.chip.live{color:var(--s-approved);border-color:currentColor}

/* tabs */
nav.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:32px;scrollbar-width:none}
nav.tabs button{border:0;background:none;padding:16px 14px 14px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:700}
nav.tabs .n{display:inline-block;min-width:18px;margin-left:6px;padding:1px 5px;border-radius:var(--r);background:var(--accent);color:var(--accent-ink);font-size:10px;text-align:center;letter-spacing:0}

/* buttons */
.bar{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;margin-bottom:24px}
.bar .grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--border,var(--line));background:var(--surface);padding:9px 16px;border-radius:var(--r);font-weight:500;font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.pri,.btn.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover,.btn.acc:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ok{background:var(--s-approved);border-color:var(--s-approved);color:var(--surface)}
.btn.ok:hover{filter:brightness(.92)}
.btn.bad{border-color:var(--s-changes);color:var(--s-changes);background:transparent}
.btn.bad:hover{background:color-mix(in srgb,var(--s-changes) 10%,transparent)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;font-size:12px}

/* type */
h2{font:700 24px/1.1 var(--font);letter-spacing:0;margin:0}
h3{font:500 12px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.muted{color:var(--muted)}
a{color:var(--accent-text);text-underline-offset:3px}
a:hover{color:var(--accent-hover)}

/* legacy calendar bits (kept for compatibility) */
.dn{font-size:12px;color:var(--muted);padding:2px 3px;font-weight:500}
.pill{display:flex;gap:6px;align-items:center;width:100%;text-align:left;border:0;border-left:3px solid var(--sc,var(--line));background:var(--surface);padding:6px 8px;font-size:12px;line-height:1.25;min-width:0;border-radius:var(--r)}
.pill:hover{background:var(--surface2)}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill b{font-weight:500;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}

/* badges */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:var(--r);background:color-mix(in srgb,var(--sc) 10%,var(--surface));color:var(--sc)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sc)}

/* tables */
table.list{width:100%;border-collapse:collapse;background:var(--surface);box-shadow:var(--shadow)}
table.list th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:left;padding:12px;border-bottom:1px solid var(--ink)}
table.list td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
table.list tr.r{cursor:pointer}
table.list tr.r:hover{background:var(--surface2)}
.tw{overflow-x:auto}

/* cards */
.card{background:var(--surface);border:0;padding:20px;border-radius:var(--r);box-shadow:var(--shadow)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;align-items:start}
.kc{background:var(--surface2);padding:12px;border-radius:var(--r);display:flex;flex-direction:column;gap:8px;min-width:0}
.kc .hd{display:flex;justify-content:space-between;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 2px 6px}
.kcard{background:var(--surface);border:0;border-top:2px solid var(--sc);border-radius:var(--r);text-align:left;padding:10px 12px;min-width:0;box-shadow:0 2px 8px -4px rgba(43,39,37,.18)}
.kcard:hover{box-shadow:var(--shadow-hover)}
.kcard small{display:block;color:var(--muted);margin-top:2px}
.empty{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}

/* overlay / dialog */
.ov{position:fixed;inset:0;background:rgba(43,39,37,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.dlg{background:var(--bg);width:100%;max-width:980px;margin:auto;box-shadow:var(--shadow-dlg);border-radius:var(--r);display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr)}
@media(max-width:760px){.dlg{grid-template-columns:minmax(0,1fr)}}
.art{aspect-ratio:4/5;background:var(--surface2);position:relative;border-radius:var(--r);overflow:hidden}
.side{padding:24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.field label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);padding:10px 12px;border-radius:var(--r)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
textarea{resize:vertical;min-height:70px;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.th{display:flex;flex-direction:column;gap:8px;max-height:280px;overflow:auto}
.ev{padding:10px 12px;background:var(--surface);border-left:2px solid var(--line);border-radius:var(--r)}
.ev.c{border-left-color:var(--accent)}
.ev .m{font-size:12px;color:var(--muted);margin-bottom:2px}
.close{position:absolute;right:12px;top:12px;z-index:3;border:0;background:var(--ink);color:var(--bg);width:32px;height:32px;border-radius:var(--r);font-size:18px;line-height:1}
.dlgwrap{position:relative;width:100%;max-width:980px;margin:auto}
.toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--grey-900);color:var(--cream-100);padding:12px 18px;border-radius:var(--r);z-index:80;max-width:90vw;box-shadow:var(--shadow-dlg);font-size:14px}
.sw{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.sw div{height:104px;padding:10px;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;border-radius:var(--r)}
.sw div small{font-size:11px;opacity:.8;letter-spacing:.06em}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
ul.clean{margin:0;padding-left:18px}
ul.clean li{margin:6px 0}
.warn{background:var(--accent-soft);border-left:2px solid var(--accent);padding:12px 14px;border-radius:var(--r);font-size:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:6px;background:var(--sc);border-radius:50%;vertical-align:1px}

/* month calendar */
.cal-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.mh{font:700 32px/1.1 var(--font);letter-spacing:0;color:var(--ink);margin:0;text-transform:none}
.cal-head p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.mnav{display:flex;gap:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:0;border-radius:var(--r);overflow:hidden;background:var(--surface);box-shadow:var(--shadow)}
.dow{padding:12px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted);border-bottom:1px solid var(--ink)}
.day{min-height:112px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:grid;align-content:start;gap:4px;min-width:0}
.cal>:nth-child(7n){border-right:0}
.day.out{background:var(--surface2)}
.day.today{background:var(--accent-soft)}
.day.today .dn{color:var(--accent-text);font-weight:700}
.pchip{display:grid;grid-template-columns:14px minmax(0,1fr) 7px;gap:6px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--r);padding:4px 6px;font-size:11.5px;min-width:0}
.pchip:hover,.pchip[aria-current=true]{border-color:var(--accent)}
.pchip[aria-current=true]{box-shadow:inset 0 0 0 1px var(--accent);background:var(--surface)}
.pchip i,.ag i{display:block;width:14px;height:18px;border-radius:1px}
.pchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.agenda{display:none;border-radius:var(--r);background:var(--surface);overflow:hidden;box-shadow:var(--shadow)}
.ag{display:grid;grid-template-columns:62px 14px minmax(0,1fr) 7px;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;font-size:14px}
.ag[aria-current=true]{background:var(--accent-soft)}
.ag small{display:block;color:var(--muted);font-size:12px}
.ag .d{font-size:12px;color:var(--muted)}

/* grid + detail */
.social-main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:32px;margin-top:32px;align-items:start}
.igwrap{background:var(--surface);border-radius:var(--r);padding:20px;display:grid;gap:16px;box-shadow:var(--shadow)}
.igprof{display:flex;align-items:center;gap:12px}
.igav{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font:700 12px var(--font);letter-spacing:.06em}
.igprof small{display:block;font-size:12px;color:var(--muted)}
.iggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px}
.tile{position:relative;aspect-ratio:4/5;max-width:100%;border:0;padding:0;overflow:hidden;background:var(--bg)}
.tile:hover{filter:brightness(.97)}
.tile[aria-current=true]{outline:2px solid var(--accent);outline-offset:-2px;z-index:1}
.tile .plan{position:absolute;left:5px;top:5px;z-index:2;display:inline-flex;gap:4px;align-items:center;background:rgba(240,235,229,.94);color:#2b2725;border-radius:var(--r);padding:2px 6px 2px 5px;font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:500}
.tile img,.pd-visual img,.av img{width:100%;height:100%;object-fit:cover;display:block}
.art2{container-type:inline-size;position:relative;width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:3%;padding:9%;overflow:hidden;text-align:left}
.art2 .k{font-size:4.4cqw;letter-spacing:.06em;text-transform:uppercase;font-weight:500;opacity:.85;position:relative}
.art2 .h{overflow-wrap:anywhere;font:700 10cqw/1.05 var(--font);letter-spacing:0;position:relative;text-wrap:balance}
.art2 .motif{position:absolute;left:0;top:0;width:100%;height:68%;fill:none;stroke:currentColor;stroke-width:.7;opacity:.4}
.art2 .fmt{position:absolute;right:6%;top:6%;width:9cqw;height:9cqw;fill:none;stroke:currentColor;stroke-width:1.8}
.art2 .fmt.play{fill:currentColor;stroke:none}
.post-detail{background:var(--surface);border:0;border-top:3px solid var(--accent);border-radius:var(--r);padding:24px;display:grid;gap:20px;min-width:0;box-shadow:var(--shadow)}
.pd-top{display:grid;grid-template-columns:minmax(0,200px) minmax(0,1fr);gap:20px;align-items:start}
.pd-visual{aspect-ratio:4/5;max-width:100%;border-radius:var(--r);overflow:hidden}
.pd-top h3{font:700 22px/1.2 var(--font);letter-spacing:0;text-transform:none;color:var(--ink);margin:10px 0}
.pd-info{display:grid;gap:12px;min-width:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-size:14px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.caption{white-space:pre-wrap;background:var(--bg);border-radius:var(--r);padding:16px;font-size:15px;line-height:1.5;margin:8px 0 0}
.caption .hl{color:var(--accent-text);font-weight:500}
.brief{border-left:2px solid var(--accent);background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;display:grid;gap:4px}
.brief q{font-style:normal;font-weight:300;font-size:18px;line-height:1.35}
.brief small{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.lnk{font-size:14px;background:none;border:0;padding:0;color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.tools{display:grid;gap:14px;box-shadow:none;background:var(--bg)}
.ready{box-shadow:none;background:var(--bg)}
.post-detail .card{box-shadow:none;background:var(--bg)}
.arch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;padding:0;text-align:left;display:grid}
.acard[aria-current=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.acard .av{aspect-ratio:4/5}
.acard .i{padding:9px 11px;display:grid;gap:2px;font-size:12px}
.acard .i b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acard .i span{color:var(--muted)}
@media(max-width:900px){.social-main{grid-template-columns:1fr}}
@media(max-width:700px){.cal{display:none}.agenda{display:block}}
@media(max-width:640px){.pd-top{grid-template-columns:1fr}.pd-visual{max-width:260px}.post-detail{padding:18px}.top{padding-top:28px}}
.noart{width:100%;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:4%;padding:9%;background:linear-gradient(165deg,var(--accent-soft),var(--surface2));color:var(--ink);container-type:inline-size;overflow:hidden;text-align:left}
.noart .k{font-size:4.6cqw;letter-spacing:.06em;text-transform:uppercase;font-weight:500;color:var(--muted)}
.noart .h{font:700 8cqw/1.1 var(--font);overflow-wrap:anywhere}
.noart .u{font-size:4.6cqw;letter-spacing:.06em;text-transform:uppercase;color:var(--accent-text);font-weight:500}
.cnt{position:absolute;right:6px;top:6px;background:rgba(43,39,37,.7);color:#f0ebe5;font-size:10px;font-weight:500;padding:1px 7px;border-radius:var(--r)}
.tile,.pd-visual,.av{position:relative}
.fbonly{position:absolute;right:5px;bottom:5px;z-index:2;background:#4f7396;color:#fff;font-size:9px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:var(--r)}
.stl{display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stl select,table.doc select{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 10px;border-radius:var(--r);text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.ready li{margin:4px 0;font-size:14px}

<div class="wrap" id="app"></div>
<script>
/* Saves to the Sabre Worker (/api/<room>/...) instead of the Claude artifact runtime. */
(function(){
  var seg=((location.pathname.split('/')[1]||'hub').toLowerCase().replace(/[^a-z0-9-]/g,''))||'hub';
  window.ROOM={brand:seg,api:'/api/'+seg+'/',tags:['Abby','Hayley']};
  try{if(/[?&]client\b/.test(location.search))localStorage.setItem('apm-room-mode','client')}catch(e){}
  async function api(path,opts){
    const url=path==='assets'?'/api/assets':window.ROOM.api+path;
    const r=await fetch(url,Object.assign({headers:{'content-type':'application/json'}},opts||{}));
    if(!r.ok)throw new Error('Save failed ('+r.status+')');
    return r.json();
  }
  function coll(name,order,lim){
    return {
      orderBy(){return coll(name,true,lim)},
      limit(n){return coll(name,order,n)},
      doc(id){return{
        set(data){return api(name+'/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(data)})},
        delete(){return api(name+'/'+encodeURIComponent(id),{method:'DELETE'})}
      }},
      onSnapshot(ok,bad){
        let last='',stop=false;
        async function tick(){
          if(stop)return;
          try{
            const rows=await api(name+(lim?'?limit='+lim:''));
            const s=JSON.stringify(rows);
            if(s!==last){last=s;ok({docs:rows.map(r=>({id:r.id,data:()=>r.data}))})}
          }catch(e){if(!last&&bad){bad(e)}}
          setTimeout(tick,5000);
        }
        tick();return function(){stop=true};
      }
    };
  }
  const db={collection:function(n){return coll(n)}};
  const user={me:async()=>({id:'browser'}),canEdit:()=>true,can:()=>true,profiles:async()=>({})};
  async function shrink(file){
    const url=URL.createObjectURL(file);
    const img=await new Promise((ok,bad)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=bad;i.src=url});
    const sc=Math.min(1,1350/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    let q=0.85,d=c.toDataURL('image/jpeg',q);
    while(d.length>1100000&&q>0.4){q-=0.1;d=c.toDataURL('image/jpeg',q)}
    return d.split(',')[1];
  }
  const assets={upload:async function(file){
    const data=await shrink(file);
    const r=await api('assets',{method:'POST',body:JSON.stringify({data,type:'image/jpeg'})});
    return {id:r.id};
  }};
  const dl={save:async function(o){
    const b=new Blob([o.data],{type:'text/csv'});const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=o.filename;document.body.appendChild(a);a.click();a.remove();
  }};
  window.claude={use:async function(k){
    if(k==='db')return db;if(k==='user')return user;if(k==='downloads')return dl;if(k==='assets')return assets;
    throw new Error('not available');
  }};
})();
</script>

async function runSeeds(){
  if(S.seeded||!S.live)return;S.seeded=true;
  try{
    const idx=await (await fetch('/seed/index.json',{cache:'no-store'})).json();
    const done=new Set((await (await fetch(window.ROOM.api+'meta',{cache:'no-store'})).json()).map(r=>r.id));
    for(const name of idx){
      if(done.has('seed-'+name))continue;
      const posts=await (await fetch('/seed/'+name+'.json',{cache:'no-store'})).json();
      let n=0;
      for(const p of posts){if(S.posts[p.id])continue;await savePost(p.id,p,{kind:'status',to:p.status,text:'Imported'});n++}
      await fetch(window.ROOM.api+'meta/'+encodeURIComponent('seed-'+name),{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({at:Date.now(),n})});
      if(n)toast('Added '+n+' new post'+(n===1?'':'s')+' from '+name+'.')
    }
  }catch(e){}
}
async function addEvent(e){
  const ev=Object.assign({at:Date.now(),by:S.mode},e);

  if(S.live){try{await S.db.collection('events').doc(id).set(ev)}catch(x){if(!S.ed)S.canWrite=false;toast('Not saved. This usually means you have view-only access. Ask the team to invite you as a Contributor. ('+(x&&(x.code||x.message)||'refused')+')');return false}}

}
function nameOf(id){if(id==='team')return 'Six Underground';if(id==='client')return 'Client';if(!id||id==='demo')return S.mode==='client'?'Client':'Six Underground';if(S.me&&id===S.me.id)return 'You';return S.names[id]||'Someone'}

}

      db.collection('events').orderBy('at','desc').limit(400).onSnapshot(sn=>{S.events=sn.docs.map(d=>Object.assign({id:d.id},d.data()));resolveNames();render()},()=>{});
      if(false)setTimeout(runSeeds,3500);

/* ---------- helpers ---------- */
const PAL=[["#000000", "#2a2a2a", "#ffffff"], ["#8e8e8e", "#5c5c5c", "#ffffff"], ["#f2f2f2", "#d4d4d4", "#000000"], ["#2a2a2a", "#0a0a0a", "#ffffff"], ["#bdbdbd", "#8e8e8e", "#000000"], ["#ffffff", "#e6e6e6", "#000000"], ["#d4d4d4", "#8e8e8e", "#000000"]];
const MOTIF=['<path d="M22 100V52a28 28 0 0 1 56 0v48"/><path d="M32 100V54a18 18 0 0 1 36 0v46"/>','<circle cx="64" cy="40" r="26"/><circle cx="64" cy="40" r="16"/>','<path d="M0 20h100M0 32h100M0 44h100M0 56h100M0 68h100"/>','<path d="M0 90L90 0M10 100L100 10M30 100L100 30"/>','<path d="M10 70h80M10 50h60M10 30h40"/><circle cx="78" cy="30" r="10"/>'];
const hash=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const palOf=p=>PAL[(hash(p.id)+(p.format==='Reel'?1:0))%PAL.length];
const sw=p=>{const c=palOf(p);return 'linear-gradient(160deg,'+c[0]+','+c[1]+')'};
const artSrc=id=>/^(https?:)?\/\//.test(id)||id[0]==='/'?id:'/_blob/'+id;
function tile(p,big){
  const ids=p.assetIds||[];
  if(ids.length){const i=big?Math.min(S.slide,ids.length-1):0;const cnt=ids.length>1?'<span class="cnt">'+(big?(i+1)+'/':'')+ids.length+'</span>':'';return '<img alt="'+esc(p.title)+'" src="'+esc(artSrc(ids[i]))+'">'+cnt}

  const n=p.slides||1;const k=(big&&n>1?(Math.min(S.slide,n-1)+1)+'/'+n+' · ':'')+p.format;
  return '<div class="art2" style="background:linear-gradient(160deg,'+c[0]+','+c[1]+');color:'+c[2]+'"><svg class="motif" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true">'+m+'</svg>'+icon+'<span class="k">HDF · '+esc(k)+'</span><span class="h">'+esc(p.title.length>46?p.title.slice(0,44)+'…':p.title)+'</span></div>';
}
const badge=s=>'<span class="badge" style="--sc:var(--s-'+s+')">'+ST[s]+'</span>';
function fmtDate(d){const x=new Date(d+'T12:00:00');return x.toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})}
function fmtTime(t){const[h,m]=t.split(':').map(Number);return(h%12||12)+':'+String(m).padStart(2,'0')+(h<12?' am':' pm')}

const linksOf=p=>[].concat(p.driveUrls||[],p.driveUrl||[]).join(' ').split(/[\s,]+/).filter(x=>/^https?:\/\//.test(x)).filter((x,i,a)=>a.indexOf(x)===i);

const mediaOf=p=>{if(p.imageUrls&&p.imageUrls.length)return p.imageUrls;const a=(p.assetIds||[]).map(id=>new URL(artSrc(id),location.origin).href);if(a.length)return a;return linksOf(p).map(driveDirect)};
function ready(p){const m=mediaOf(p);const n=Math.max(p.slides||1,(p.assetIds||[]).length,m.length);const when=new Date(p.date+'T'+p.time+':00');
  return [['Approved',['approved','scheduled'].includes(p.status)],['Caption written',!!(p.caption||'').trim()],['Channel chosen',p.platforms.length>0],['Artwork link for every slide ('+m.length+' of '+n+')',m.length>=n&&m.length>0],['Scheduled date still in the future',when>new Date()]]}
const MC={server:'Metricool_Social_Media_Management',blog:'7005212',label:'hanzdefuko_ausnz',tz:'Australia/Sydney'};
function sydIso(d,t){const want=d+'T'+t+':00';const f=new Intl.DateTimeFormat('en-CA',{timeZone:MC.tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  for(const off of [11,10]){const inst=Date.parse(want+'Z')-off*3600000;const q={};f.formatToParts(new Date(inst)).forEach(x=>q[x.type]=x.value);if(q.year+'-'+q.month+'-'+q.day+'T'+q.hour+':'+q.minute+':'+q.second===want)return want+'+'+String(off).padStart(2,'0')+':00'}
  return want+'+11:00'}
function mcBlock(p){

}

function parseTable(txt){
  txt=txt.replace(/^﻿/,'');
  const first=txt.split(/\r?\n/)[0]||'';const d=first.includes('\t')?'\t':',';
  const rows=[];let row=[],cur='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()))rows.push(row);return rows}
function normDate(v){v=(v||'').trim();let m=v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  const MN=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  let mo=-1,day=0,yr=0;
  m=v.match(/^(?:[A-Za-z]+,?\s+)?([A-Za-z]{3,9})\.?\s+(\d{1,2})(?:st|nd|rd|th)?(?:,?\s+(\d{4}))?/);
  if(m){mo=MN.indexOf(m[1].slice(0,3).toLowerCase());day=+m[2];yr=+(m[3]||0)}
  if(mo<0){m=v.match(/^(?:[A-Za-z]+,?\s+)?(\d{1,2})(?:st|nd|rd|th)?\s+([A-Za-z]{3,9})\.?(?:,?\s+(\d{4}))?/);if(m){mo=MN.indexOf(m[2].slice(0,3).toLowerCase());day=+m[1];yr=+(m[3]||0)}}
  if(mo<0||!day)return '';
  if(!yr){const t=new Date();yr=t.getFullYear();const cand=new Date(yr,mo,day);if(cand<new Date(t.getFullYear(),t.getMonth(),t.getDate()-60))yr++}
  return yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(day).padStart(2,'0')}
function normTime(v){const m=(v||'').trim().match(/^(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);if(!m)return '08:00';let h=+m[1];if(m[3]){const pm=m[3].toLowerCase()==='pm';if(pm&&h<12)h+=12;if(!pm&&h===12)h=0}return String(h).padStart(2,'0')+':'+m[2]}

async function pdfToItems(file,say){
  await loadPdfJs();

  const items=[];

    const page=await doc.getPage(pn);const vp=page.getViewport({scale:1});const W=vp.width,H=vp.height;
    const tc=await page.getTextContent();

    const ol=await page.getOperatorList();let ctm=[1,0,0,1,0,0];const st=[];const imgs=[];
    for(let i=0;i<ol.fnArray.length;i++){const f=ol.fnArray[i],a=ol.argsArray[i];
      if(f===OPS.save)st.push(ctm);
      else if(f===OPS.restore){if(st.length)ctm=st.pop()}

      else if(f===OPS.paintFormXObjectEnd){if(st.length)ctm=st.pop()}

        const x0=Math.min(ctm[4],ctm[4]+ctm[0]),x1=Math.max(ctm[4],ctm[4]+ctm[0]),y0=Math.min(ctm[5],ctm[5]+ctm[3]),y1=Math.max(ctm[5],ctm[5]+ctm[3]);
        imgs.push({x0,x1,top:H-y1,bottom:H-y0,id:a[0],inline:f===OPS.paintInlineImageXObject,page})}

    const groups=[];for(const m of pics){const g=groups[groups.length-1];if(g&&m.top-g.bottom<=5){g.imgs.push(m);g.bottom=Math.max(g.bottom,m.bottom)}else groups.push({top:m.top,bottom:m.bottom,imgs:[m]})}
    const PAD=9;const starts=groups.map(g=>g.top-PAD);

    const rows=groups.map(g=>({imgs:g.imgs.sort((p,q)=>Math.round(p.top/25)-Math.round(q.top/25)||p.x0-q.x0),date:'',lines:[]}));
    const cont={lines:[]};
    // text lines (caption column) and dates (left column)
    const byRow=new Map();
    for(const t of T){
      const k=rowOf(t.yb-8);
      if(t.x<W*0.2){const isDate=/^[A-Za-z]{3,9}\.?\s*\d{1,2}|^\d{1,2}[\/.\- ]/.test(t.s.trim());if(isDate&&k>=0&&!rows[k].date)rows[k].date=t.s.trim();continue}
      if(t.x<W*0.5)continue;

      return ls};
    const reflow=raw=>{const ls=mkLines(raw);if(!ls.length)return'';
      const gaps=ls.slice(1).map((l,i)=>l.yb-ls[i].yb);const base=gaps.length?Math.max(Math.min(...gaps),8):12;
      const MK=/^\*?(vid|video|reel)$/i;let out=[],cur='',prev=null,px1=0;

        const brk=/^(✔|•|-|#|📷|🎥|📸)/.test(t)||MK.test(t)||(prev!==null&&MK.test(cur.trim()));

        else if(np||brk){out.push(cur);if(np)out.push('');cur=t}
        else{const last=cur.split(' ').pop();cur+=((/^https?:/.test(last)&&px1>W-60)?'':' ')+t}
        prev=l.yb;px1=l.x1}
      out.push(cur);return out.join('\n').trim()};
    rows.forEach(r=>{r.cap=reflow(r.raw)});

    for(const r of rows){

async function imgBlob(m){
  const store=m.id&&String(m.id).startsWith('g_')?m.page.commonObjs:m.page.objs;
  const im=m.inline?m.id:await new Promise(res=>store.get(m.id,res));

  const src=document.createElement('canvas');src.width=w;src.height=h;const sx=src.getContext('2d');
  if(im.bitmap){sx.drawImage(im.bitmap,0,0)}
  else{const d=im.data,n=w*h;const out=sx.createImageData(w,h);const o=out.data;
    if(im.kind===3||(d.length===n*4)){o.set(d.subarray(0,n*4))}
    else if(im.kind===2||(d.length===n*3)){for(let i=0,j=0;i<n;i++){o[j++]=d[i*3];o[j++]=d[i*3+1];o[j++]=d[i*3+2];o[j++]=255}}
    else{const rb=(w+7)>>3;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const bit=(d[y*rb+(x>>3)]>>(7-(x&7)))&1;const v=bit?255:0;const j=(y*w+x)*4;o[j]=o[j+1]=o[j+2]=v;o[j+3]=255}}
    sx.putImageData(out,0,0)}
  c.width=Math.round(w*sc);c.height=Math.round(h*sc);const cx=c.getContext('2d');cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height);cx.drawImage(src,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
}

  if(ix.date<0||(ix.title<0&&ix.cap<0)){S.impMsg='I need a "date" column and a "caption" (or "title") column in the header row.';return render()}
  let n=0,bad=0;const stamp=Date.now().toString(36);
  for(let i=1;i<rows.length;i++){const r=rows[i];const g=k=>k==='links'?head.map((h,i)=>i!==capI&&/artwork|url|photo|image|drive|link/.test(h)?(r[i]||''):'').join(' ').trim():(ix[k]>=0?(r[ix[k]]||'').trim():'');
    const date=normDate(g('date'));let cap=g('cap');
    let mark='';cap=cap.replace(/(^|\n)\s*(REEL|VID|VIDEO|STORY|STORIES|CAROUSEL)\s*(?=\n|$)/gi,(m0,pre,w)=>{mark=w.toLowerCase();return pre}).replace(/\n{3,}/g,'\n\n').trim();
    let title=g('title');if(!title){title=(cap.split('\n').find(x=>x.trim())||'').trim();if(title.length>70)title=title.slice(0,67).trim()+'…'}
    if(!title||!date){bad++;continue}
    const ch=g('ch').toLowerCase();const pl=[];if(!ch||ch.includes('insta'))pl.push('instagram');if(!ch||ch.includes('face')||ch==='fb')pl.push('facebook');if(!pl.length)pl.push('instagram');
    const urls=g('links').split(/[\s,;]+/).filter(x=>/^https?:/.test(x));
    const f=(g('format')||mark).toLowerCase();
    const format=/carousel/.test(f)?'Carousel':/reel|vid/.test(f)?'Reel':/stor/.test(f)?'Story':(urls.length>1?'Carousel':'Static');
    const id='p'+stamp+i;
    const imgs=urls.map(u=>{if(/\.(jpe?g|png|webp|gif|avif)(\?|$)/i.test(u)||u.includes('/art/'))return u;const m=u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{10,})/);return m?'https://drive.google.com/thumbnail?id='+m[1]+'&sz=w1000':''}).filter(Boolean);
    const post={id,date,time:normTime(g('time')),format,platforms:pl,title,caption:cap,driveUrls:urls,driveUrl:urls[0]||'',status:S.impStatus||'review',note:'',slides:Math.max(1,urls.length),assetIds:imgs.length===urls.length?imgs:[],imageUrls:[]};
    await savePost(id,post,{kind:'status',to:S.impStatus||'review',text:'Imported'});n++}
  S.impMsg='';S.importing=false;toast('Imported '+n+' post'+(n===1?'':'s')+(bad?' ('+bad+' skipped: missing date or caption)':'')+'.');render()}
function addForm(){
  return '<div class="ov" data-act="bg"><div class="dlgwrap" style="max-width:520px"><button class="close" data-act="close" aria-label="Close">×</button><div class="dlg" style="grid-template-columns:1fr"><div class="side"><h2>Add post</h2><p class="muted" style="margin:0">It lands as a draft on the calendar and at the top of the grid straight away. Upload the images to preview them in the grid; for a carousel, select every slide in order.</p>'+
  '<div class="field"><label>Title</label><input id="a_t"></div><div class="row"><div class="field"><label>Date</label><input type="date" id="a_d" value="'+TODAY+'"></div><div class="field"><label>Time</label><input type="time" id="a_h" value="08:00"></div></div>'+
  '<div class="field"><label>Format</label><select id="a_f"><option>Static</option><option>Carousel</option><option>Reel</option><option>Story</option></select></div>'+
  '<div class="field"><label>Caption</label><textarea id="a_c" rows="5"></textarea></div><div class="row"><label><input type="checkbox" id="a_i" checked> Instagram</label><label><input type="checkbox" id="a_fb" checked> Facebook</label></div>'+
  '<div class="field"><label>Artwork links: one per line, add a line for each slide of a carousel</label><textarea id="a_drv" rows="4" placeholder="Slide 1 link&#10;Slide 2 link&#10;Slide 3 link"></textarea><div class="row" style="margin-top:6px"><button type="button" class="btn sm" data-act="morelinks" data-v="a_drv">+ Add another link</button></div></div>'+
  (S.assets?'<div class="field"><label>Artwork images (optional, one per slide, in order)</label><input type="file" id="a_art" accept="image/*" multiple></div>':'')+
  '<div class="row"><button class="btn acc" data-act="create">Create draft</button></div></div></div></div></div>';
}
function render(){
  if(S.orderAuto!==S.mode){S.orderAuto=S.mode;S.order=S.mode==='client'?'new':'old'}
  const a=document.activeElement;const keep=a&&a.id&&['cm','capEd','capEdC'].includes(a.id)?{id:a.id,s:a.selectionStart}:null;const sy=window.scrollY;
  if(S.mode==='client'&&S.tab!=='grid'&&S.tab!=='doc'){S.tab='grid';S.sel=null}
  const v={content,grid:gridTab,doc:docTab,approvals,pipeline,export:exportView,brand,activity}[S.tab]();
  $('#app').innerHTML=header()+'<main>'+v+'</main>'+(S.adding?addForm():'')+(S.importing?importForm():'')+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':'');
  window.scrollTo(0,sy);if(keep){const el=document.getElementById(keep.id);if(el){el.focus();try{el.setSelectionRange(keep.s,keep.s)}catch(e){}}}
}

/* ---------- events ---------- */
document.addEventListener('input',e=>{if(e.target.id==='cm')S.draft=e.target.value;if(e.target.id==='capEdC')S.capDraft=e.target.value});
document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset&&t.dataset.act;if(!a)return;
  if(a==='filter'){S.filter=t.value;render()}
  else if(a==='bsel'){if(t.checked)S.bsel[t.dataset.v]=1;else delete S.bsel[t.dataset.v];S.bdel=false;render()}
  else if(a==='ball'){S.bsel={};if(t.checked)sortPosts().forEach(p=>S.bsel[p.id]=1);S.bdel=false;render()}
  else if(a==='setstatus'){const p=S.posts[t.dataset.id||S.sel];await savePost(p.id,{status:t.value},{kind:'status',to:t.value});if(t.value==='changes'&&!isTeam())toast('Status set. Add a comment below so the team knows what to change.')}
  else if(a==='exf'){S.exp.from=t.value||S.exp.from;render()}
  else if(a==='ext'){S.exp.to=t.value||S.exp.to;render()}
  else if(a==='exs'){S.exp.st[t.dataset.v]=t.checked;render()}
  else if(a==='upload'&&S.assets&&S.sel){
    const p=S.posts[S.sel];const ids=(p.assetIds||[]).slice();
    try{for(const f of t.files){const r=await S.assets.upload(f);ids.push(r.id)}
      const patch={assetIds:ids,slides:ids.length};if(ids.length>1&&p.format==='Static')patch.format='Carousel';await savePost(p.id,patch,{kind:'status',to:p.status,text:'Artwork uploaded ('+ids.length+' image'+(ids.length>1?'s':'')+')'});toast('Artwork added')}
    catch(x){toast('Upload failed: '+(x&&x.message||x&&x.code||'refused'))}
  }
});
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  if(['filter','exf','ext','exs','upload','cap','bsel','ball'].includes(a))return;
  if(a==='bg'){if(e.target!==el)return;S.sel=null;S.adding=false;return render()}
  if(a==='mode'){S.mode=v;try{localStorage.setItem('hanzdefuko-room-mode',v)}catch(x){}return render()}
  if(a==='tab'){S.tab=v;if(v==='doc')S.sel=null;return render()}
  if(a==='view'){S.view=v;return render()}
  if(a==='mnav'){S.sel=null;const[y,m]=S.month.split('-').map(Number);const d=new Date(y,m-1+Number(v),1);S.month=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');return render()}
  if(a==='mtoday'){S.sel=null;S.month=TODAY.slice(0,7);return render()}
  if(a==='open'){const p=S.posts[v];if(p)S.month=p.date.slice(0,7);S.tab='content';S.sub='calendar';S.sel=v;S.slide=0;S.draft='';render();const d=document.querySelector('.post-detail');if(d)d.scrollIntoView({block:'start'});return}
  if(a==='pick'){S.sel=v;S.slide=0;S.draft='';S.tools=false;render();if(window.innerWidth<=900){const d=document.querySelector('.post-detail');if(d)d.scrollIntoView({block:'start',behavior:'smooth'})}return}
  if(a==='sub'){S.sub=v;S.sel=null;return render()}
  if(a==='mc'){return mcPush(S.posts[S.sel],true)}
  if(a==='mcs'){if(S.cmc!==S.sel){S.cmc=S.sel;return render()}return mcPush(S.posts[S.sel],false)}
  if(a==='bdelask'){S.bdel=true;return render()}
  if(a==='bdelno'){S.bdel=false;return render()}
  if(a==='bclear'){S.bsel={};S.bdel=false;return render()}
  if(a==='bdelyes'){if(!isTeam())return;const ids=Object.keys(S.bsel).filter(id=>S.posts[id]);let done=0;
    for(const id of ids){const evs=S.events.filter(x=>x.postId===id);
      if(S.live){try{await S.db.collection('posts').doc(id).delete();for(const x of evs){if(x.id)await S.db.collection('events').doc(x.id).delete().catch(()=>{})}}catch(x){toast('Could not delete some posts: '+(x&&x.message||'refused'));break}}
      else{S.events=S.events.filter(x=>x.postId!==id)}
      delete S.posts[id];if(S.sel===id)S.sel=null;done++}
    S.bsel={};S.bdel=false;toast(done+' post'+(done===1?'':'s')+' deleted');return render()}
  if(a==='delask'){S.cdel=S.sel;return render()}
  if(a==='delno'){S.cdel=null;return render()}
  if(a==='delyes'){const id=S.sel;if(!id||S.cdel!==id)return;const evs=S.events.filter(x=>x.postId===id);
    if(S.live){try{await S.db.collection('posts').doc(id).delete();for(const x of evs){if(x.id)await S.db.collection('events').doc(x.id).delete().catch(()=>{})}}catch(x){toast('Could not delete: '+(x&&x.message||'refused'));return}}
    else{S.events=S.events.filter(x=>x.postId!==id)}
    delete S.posts[id];S.cdel=null;S.sel=null;toast('Post deleted');return render()}
  if(a==='slk'){if(!S.cslack){S.cslack=true;return render()}return slackSend()}
  if(a==='slkx'){S.cslack=false;return render()}
  if(a==='mcx'){S.cmc=null;return render()}
  if(a==='ord'){S.order=v;return render()}
  if(a==='docopen'){S.sel=S.sel===v?null:v;S.slide=0;S.draft='';render();const d=document.querySelector('.post-detail');if(d&&S.sel)d.scrollIntoView({block:'start',behavior:'smooth'});return}
  if(a==='cf'){S.cf=v;S.sel=null;return render()}
  if(a==='tools'){S.tools=!S.tools;return render()}
  if(a==='rmslide'){const p=S.posts[S.sel];const ids=(p.assetIds||[]).slice();ids.splice(Math.min(S.slide,ids.length-1),1);S.slide=0;await savePost(p.id,{assetIds:ids,slides:Math.max(1,ids.length)},{kind:'status',to:p.status,text:'Slide removed'});return}
  if(a==='morelinks'){const t=document.getElementById(v);if(t){t.value=t.value.replace(/\s+$/,'')+(t.value.trim()?'\n':'');t.focus()}return}
  if(a==='savedrive'){const l=document.getElementById('drv').value.split(/[\s,]+/).filter(x=>x);await savePost(S.sel,{driveUrls:l,driveUrl:l[0]||''});toast('Artwork link saved');return}
  if(a==='clearart'){await savePost(S.sel,{assetIds:[]},{kind:'status',to:S.posts[S.sel].status,text:'Artwork removed'});return}
  if(a==='close'){S.sel=null;S.adding=false;S.importing=false;return render()}
  if(a==='slide'){const p=S.posts[S.sel];const n=(p.assetIds||[]).length||p.slides||1;S.slide=(S.slide+Number(v)+n)%n;return render()}
  if(a==='add'){S.adding=true;return render()}
  if(a==='import'){S.importing=true;S.impMsg='';return render()}
  if(a==='importtpl'){const t='date,caption,artwork URL\nNov 5,"Caption goes here","https://drive.google.com/a, https://drive.google.com/b"\nNov 9,"Reel caption here\nREEL",https://drive.google.com/c\n';if(S.dl)S.dl.save({filename:'hanz-de-fuko-import-template.csv',data:t});return}
  if(a==='importgo'){const pf=document.getElementById('imp_pdf');if(pf&&pf.files.length)return runPdfImport(pf.files[0]);S.impStatus=((document.getElementById('imp_st')||{}).value==='draft')?'draft':'review';const fl=document.getElementById('imp_f');let t=(document.getElementById('imp_t')||{}).value||'';if(fl&&fl.files.length)t=await fl.files[0].text();return runImport(t)}
  if(a==='approve'){const id=v;await savePost(id,{status:'approved'},{kind:'status',to:'approved'});toast('Approved');return}
  if(a==='changes'){const t=(document.getElementById('cm')||{}).value||'';if(!t.trim()){toast('Add a comment saying what to change');return}
    const id=v;await savePost(id,{status:'changes'},{kind:'comment',text:t.trim()});await addEvent({postId:id,kind:'status',to:'changes'});S.draft='';render();return}
  if(a==='status'){const p=S.posts[S.sel];await savePost(p.id,{status:v},{kind:'status',to:v});return}
  if(a==='qclear'){S.quote='';const q=document.getElementById('qbar');if(q)q.innerHTML='';return}
  if(a==='ncomment'){const c=document.querySelector('.post-detail .caption');if(S.cm&&c){try{await S.cm.openComposer({element:c})}catch(x){toast('Commenting is not available here. Use Comment mode in the toolbar.')}}else toast('Commenting is not available here. Use Comment mode in the toolbar.');return}
  if(a==='qgo'&&S.canWrite===false&&S.cm&&S.range){const f=document.getElementById('qfloat');try{await S.cm.openComposer({range:S.range})}catch(x){toast('Commenting is not available here.')}if(f)f.hidden=true;return}
  if(a==='qgo'){const c=document.getElementById('cm');const f=document.getElementById('qfloat');if(f)f.hidden=true;if(c){c.scrollIntoView({block:'center',behavior:'smooth'});c.focus()}return}
  if(a==='mention'){const el=document.getElementById('cm');if(el){const sp=el.value&&!/\s$/.test(el.value)?' ':'';el.value+=sp+'@'+v+' ';S.draft=el.value;el.focus()}return}
  if(a==='comment'){const t=(document.getElementById('cm')||{}).value||'';if(!t.trim())return;const ev={postId:S.sel,kind:'comment',text:t.trim()};
    const men=[...new Set((t.match(new RegExp('@('+window.ROOM.tags.join('|')+')\\b','gi'))||[]).map(x=>x.slice(1).toLowerCase()))];if(men.length)ev.mentions=men;if(S.quote&&S.quoteFor===S.sel)ev.quote=S.quote;const ok=await addEvent(ev);if(!ok)return;
    if(men.length){const pp=S.posts[S.sel]||{};fetch(window.ROOM.api+'notify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({mentions:men,by:S.mode,postTitle:pp.title||'a post',text:t.trim()})}).then(r=>{if(!r.ok)throw 0;toast('Comment posted. Email sent to '+men.join(', ')+'.')}).catch(()=>toast('Comment saved, but the email could not be sent.'))}
    S.draft='';S.quote='';render();return}
  if(a==='capedit'){S.capEdit=S.sel;S.capDraft=(S.posts[S.sel]||{}).caption||'';render();return}
  if(a==='capcancel'){S.capEdit=null;S.capDraft=null;render();return}
  if(a==='capsave'){const el=document.getElementById('capEdC');const p=S.posts[S.sel];if(!el||!p)return;const nv=el.value;S.capEdit=null;S.capDraft=null;if(nv===p.caption){render();return}const old=p.caption||'';await savePost(S.sel,{caption:nv},{kind:'edit',text:'Previous caption: '+(old.length>400?old.slice(0,400)+'…':old)});toast('Caption saved');return}
  if(a==='savecap'){await savePost(S.sel,{caption:document.getElementById('capEd').value},{kind:'status',to:S.posts[S.sel].status,text:'Caption edited'});toast('Caption saved');return}
  if(a==='saveurls'){const u=document.getElementById('urls').value.split(/\s*\n\s*/).map(x=>x.trim()).filter(Boolean).slice(0,10);await savePost(S.sel,{imageUrls:u});toast('URLs saved');return}
  if(a==='savedt'){const d=document.getElementById('dd').value,t=document.getElementById('tt').value;if(!d||!t)return;await savePost(S.sel,{date:d,time:t},{kind:'status',to:S.posts[S.sel].status,text:'Rescheduled to '+d+' '+t});toast('Rescheduled');return}
  if(a==='create'){const t=document.getElementById('a_t').value.trim();if(!t){toast('Give the post a title');return}
    const pl=[];if(document.getElementById('a_i').checked)pl.push('instagram');if(document.getElementById('a_fb').checked)pl.push('facebook');if(!pl.length){toast('Pick a channel');return}
    const id='p'+Date.now().toString(36);
    const p={id,date:document.getElementById('a_d').value,time:document.getElementById('a_h').value,format:document.getElementById('a_f').value,platforms:pl,title:t,caption:document.getElementById('a_c').value,driveUrls:((document.getElementById('a_drv')||{}).value||'').split(/[\s,]+/).filter(x=>x),driveUrl:(((document.getElementById('a_drv')||{}).value||'').split(/[\s,]+/).filter(x=>x))[0]||'',status:'draft',note:'',slides:1,assetIds:[],imageUrls:[]};
    const fl=document.getElementById('a_art');if(fl&&fl.files.length&&S.assets){try{for(const f of fl.files){const r=await S.assets.upload(f);p.assetIds.push(r.id)}if(p.assetIds.length>1&&p.format==='Static')p.format='Carousel';p.slides=Math.max(1,p.assetIds.length)}catch(x){toast('Artwork upload failed: '+(x&&x.message||'refused'))}}
    S.adding=false;await savePost(id,p,{kind:'status',to:'draft',text:'Post created'});S.month=p.date.slice(0,7);S.tab='content';S.sub='calendar';S.sel=id;render();return}
  if(a==='csv'){const rows=rowsFor();if(!rows.length||!S.dl)return;
    try{await S.dl.save({filename:'hanzdefuko-metricool-bulk-'+S.exp.from+'-to-'+S.exp.to+'.csv',data:csvOf(rows)});toast('CSV ready')}catch(x){if(!x||x.code!=='declined')toast('Download not available here')}return}
});
let selT;document.addEventListener('selectionchange',()=>{clearTimeout(selT);selT=setTimeout(selCheck,200)});
function selCheck(){let f=document.getElementById('qfloat');const s=window.getSelection();const hide=()=>{if(f)f.hidden=true};
  if(!s||s.isCollapsed||!s.rangeCount||!S.sel)return hide();
  const rg=s.getRangeAt(0);const cap=document.querySelector('.post-detail .caption');
  if(!cap||!cap.contains(rg.commonAncestorContainer))return hide();
  const t=s.toString().trim();if(!t||t.length>300)return hide();
  S.quote=t;S.quoteFor=S.sel;S.range=rg.cloneRange();const q=document.getElementById('qbar');if(q)q.innerHTML=qbarHtml();
  if(!f){f=document.createElement('button');f.id='qfloat';f.className='qfloat';f.dataset.act='qgo';f.textContent='Comment on this';f.addEventListener('mousedown',e=>e.preventDefault());document.body.appendChild(f)}
  const rc=rg.getBoundingClientRect();f.hidden=false;f.style.top=(window.scrollY+rc.bottom+8)+'px';f.style.left=Math.max(8,Math.min(window.scrollX+rc.left,window.innerWidth-150))+'px'}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.sel||S.adding)){S.sel=null;S.adding=false;render()}});
boot();
})();
</script>
